<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Backend Monitor</title>
    <style>
        body {
            background: #000;
            color: #e5e7eb;
            /* Soft ivory/white */
            font-family: 'Segoe UI', 'Consolas', 'Monaco', monospace;
            margin: 0;
            padding: 15px;
            overflow-x: hidden;
            font-size: 13px;
            line-height: 1.6;
            letter-spacing: 0.5px;
        }

        #log-container {
            white-space: pre-wrap;
            word-wrap: break-word;
            border-left: 2px solid #b45309;
            /* Bronze accent */
            padding-left: 15px;
        }

        .error {
            color: #f87171;
            font-weight: 600;
        }

        .system {
            color: #d4af37;
            font-weight: 700;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            margin-bottom: 10px;
            display: block;
        }

        .token {
            color: #38bdf8;
        }

        /* Cyan for tokens to keep it readable but pro */

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #000;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #d4af37, #b45309);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #d4af37;
        }

        #command-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #111;
            padding: 10px;
            border-top: 1px solid #b45309;
            display: flex;
            gap: 10px;
        }

        #command-input {
            flex: 1;
            background: #000;
            border: 1px solid #333;
            color: #d4af37;
            padding: 8px 12px;
            font-family: inherit;
            outline: none;
            border-radius: 4px;
        }

        #command-input:focus {
            border-color: #d4af37;
        }

        body {
            padding-bottom: 60px;
            /* Space for input */
        }
    </style>
</head>

<body>
    <div id="log-container"></div>
    <div id="command-wrapper">
        <input type="text" id="command-input" placeholder="Enter dev command (e.g. /notify hello)..." />
    </div>
    <script>
        const { ipcRenderer } = require('electron');
        const container = document.getElementById('log-container');

        // 初始化訊息
        const welcome = document.createElement('div');
        welcome.className = 'system';
        welcome.textContent = `[System] Backend Monitor Started at ${new Date().toLocaleTimeString()}\nWaiting for logs...\n------------------------------------------------\n`;
        container.appendChild(welcome);

        ipcRenderer.on('backend-log', (event, text) => {
            const span = document.createElement('span');
            if (text.startsWith('[ERROR]')) {
                span.className = 'error';
            }
            span.textContent = text;
            container.appendChild(span);

            // 自動滾動到底部
            window.scrollTo(0, document.body.scrollHeight);
        });

        const commandInput = document.getElementById('command-input');
        commandInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const cmd = commandInput.value.trim();
                if (cmd) {
                    console.log('Sending dev-command:', cmd);
                    ipcRenderer.send('dev-command', cmd);
                    // 在日誌中顯示已發送指令
                    const cmdLog = document.createElement('div');
                    cmdLog.style.color = '#888';
                    cmdLog.style.fontStyle = 'italic';
                    cmdLog.textContent = `> ${cmd}`;
                    container.appendChild(cmdLog);
                    commandInput.value = '';
                }
            }
        });
    </script>
</body>

</html>
